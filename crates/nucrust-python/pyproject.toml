[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "nucrust"
version = "0.1.0"
description = "GPU-accelerated nuclear reaction rate calculations"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "nucrust_python"
