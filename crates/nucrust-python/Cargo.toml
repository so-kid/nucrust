[package]
name = "nucrust-python"
description = "Python bindings for nucrust via PyO3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "nucrust_python"
crate-type = ["cdylib"]

[dependencies]
nucrust-core = { workspace = true }
nucrust-special = { workspace = true }
nucrust-data = { workspace = true }
nucrust-optical = { workspace = true }
nucrust-hf = { workspace = true }
nucrust-rmatrix = { workspace = true }
nucrust-astro = { workspace = true }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"

[build-dependencies]
pyo3-build-config = "0.22"

[features]
default = []
