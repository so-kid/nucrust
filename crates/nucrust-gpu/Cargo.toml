[package]
name = "nucrust-gpu"
description = "GPU backend (CUDA) for nucrust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nucrust-core = { workspace = true }
nucrust-special = { workspace = true }
cudarc = { version = "0.16", features = ["std", "driver", "nvrtc", "cuda-version-from-build-system"], optional = true }
num-complex = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
cuda = ["cudarc"]
