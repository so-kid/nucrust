[package]
name = "nucrust"
description = "GPU-accelerated nuclear reaction rate calculation framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nucrust-core = { workspace = true }
nucrust-special = { workspace = true }
nucrust-data = { workspace = true }
nucrust-optical = { workspace = true }
nucrust-hf = { workspace = true }
nucrust-rmatrix = { workspace = true }
nucrust-astro = { workspace = true }
num-complex = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }

[[bin]]
name = "nucrust"
path = "src/main.rs"

[features]
default = []
# CPU parallelism via rayon for transmission coefficients, HF summation,
# and batch Coulomb functions. Primary acceleration path on macOS (no CUDA).
parallel = [
    "nucrust-special/parallel",
    "nucrust-optical/parallel",
    "nucrust-hf/parallel",
]
# SIMD batch Coulomb functions (wide: AVX2 on x86_64, NEON on aarch64).
simd = ["nucrust-special/simd"]
